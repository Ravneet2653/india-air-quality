name: Hourly air quality ingestion

on:
  schedule:
    # Every hour, on the hour (UTC). GitHub queues cron jobs on shared
    # runners, so the actual start time can drift by several minutes.
    - cron: "0 * * * *"
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write           # needed to commit the updated database

concurrency:
  group: ingest
  cancel-in-progress: false # never let two runs write the database at once

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        run: python ingest.py

      - name: Commit updated warehouse
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/air_quality.db
          if git diff --staged --quiet; then
            echo "No new readings; nothing to commit."
          else
            git commit -m "data: hourly ingestion $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Another run may have pushed while this one was working.
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
